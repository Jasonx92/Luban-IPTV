name: Build Luban IPTV APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Web Assets and Setup Capacitor
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init "Luban IPTV" "com.mohammedfadhil.lubaniptv" --web-dir www
          npx cap add android

      - name: Configure Android Permissions & TV Support
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # Allow cleartext HTTP streams (HLS etc.)
          sed -i '0,/<application/s//<application android:usesCleartextTraffic="true"/' $MANIFEST
          # Optional legacy HTTP library (inside <application>)
          sed -i '/<application/,/>/{/>/a \        <uses-library android:name="org.apache.http.legacy" android:required="false" />
          }' $MANIFEST
          # Android TV / remote support
          sed -i '0,/<application/s//<uses-feature android:name="android.software.leanback" android:required="false" \/>\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false" \/>\n    <application/' $MANIFEST

      - name: Build APK via Gradle
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: Luban-IPTV-v4.5-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
