name: Build Luban IPTV APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Web Assets and Setup Capacitor
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 hls.js@1.5.13
          cp node_modules/hls.js/dist/hls.min.js www/
          npx cap init "Luban IPTV" "com.mohammedfadhil.lubaniptv" --web-dir www
          node <<'EOF'
          const fs = require('fs');
          const f = 'capacitor.config.json';
          const c = JSON.parse(fs.readFileSync(f, 'utf8'));
          c.server = { androidScheme: 'http', cleartext: true };
          c.plugins = { CapacitorHttp: { enabled: true } };
          c.android = { allowMixedContent: true };
          c.overrideUserAgent = 'VLC/3.0.20 LibVLC/3.0.20';
          fs.writeFileSync(f, JSON.stringify(c, null, 2));
          EOF
          npx cap add android

      - name: Force App Name
        run: |
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">Luban IPTV</string>|' android/app/src/main/res/values/strings.xml
          sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">Luban IPTV</string>|' android/app/src/main/res/values/strings.xml

      - name: Configure Manifest and Gradle
        run: |
          node <<'EOF'
          const fs = require('fs');
          const p = 'android/app/src/main/AndroidManifest.xml';
          let m = fs.readFileSync(p, 'utf8');
          if (!m.includes('usesCleartextTraffic')) {
            m = m.replace('<application', '<application android:usesCleartextTraffic="true"');
          }
          if (!m.includes('android.software.leanback')) {
            m = m.replace('<application',
              '<uses-feature android:name="android.software.leanback" android:required="false" />\n' +
              '    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n' +
              '    <application');
          }
          if (!m.includes('LEANBACK_LAUNCHER')) {
            m = m.replace('<category android:name="android.intent.category.LAUNCHER" />',
              '<category android:name="android.intent.category.LAUNCHER" />\n' +
              '                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />');
          }
          if (!m.includes('screenOrientation')) {
            m = m.replace('<activity', '<activity android:screenOrientation="sensorLandscape"');
          }
          if (!m.includes('.PlayerActivity')) {
            m = m.replace('</application>',
              '    <activity android:name=".PlayerActivity"\n' +
              '            android:screenOrientation="sensorLandscape"\n' +
              '            android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"\n' +
              '            android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen" />\n' +
              '    </application>');
          }
          if (!m.includes('<queries>')) {
            m = m.replace('</manifest>',
              '    <queries>\n' +
              '        <package android:name="org.videolan.vlc" />\n' +
              '    </queries>\n' +
              '</manifest>');
          }
          fs.writeFileSync(p, m);

          const g = 'android/app/build.gradle';
          let t = fs.readFileSync(g, 'utf8');
          if (!t.includes('media3')) {
            t = t.replace(/dependencies\s*\{/,
              'dependencies {\n' +
              '    implementation "androidx.media3:media3-exoplayer:1.5.1"\n' +
              '    implementation "androidx.media3:media3-exoplayer-hls:1.5.1"\n' +
              '    implementation "androidx.media3:media3-ui:1.5.1"');
          }
          fs.writeFileSync(g, t);
          EOF

      - name: Add Native Player Code
        run: |
          D=android/app/src/main/java/com/mohammedfadhil/lubaniptv

          cat > $D/ExternalPlayerPlugin.java <<'EOF'
          package com.mohammedfadhil.lubaniptv;

          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.net.Uri;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "ExternalPlayer")
          public class ExternalPlayerPlugin extends Plugin {
            @PluginMethod
            public void play(PluginCall call) {
              String url = call.getString("url");
              String title = call.getString("title", "");
              String pkg = call.getString("package", "");
              if (url == null) { call.reject("no_url"); return; }
              Intent i = new Intent(Intent.ACTION_VIEW);
              i.setDataAndType(Uri.parse(url), "video/*");
              i.putExtra("title", title);
              if (pkg != null && !pkg.isEmpty()) i.setPackage(pkg);
              try {
                getActivity().startActivity(i);
                call.resolve();
              } catch (ActivityNotFoundException e) {
                try {
                  i.setPackage(null);
                  getActivity().startActivity(Intent.createChooser(i, "Open with"));
                  call.resolve();
                } catch (Exception e2) {
                  call.reject("not_installed");
                }
              }
            }
          }
          EOF

          cat > $D/NativePlayerPlugin.java <<'EOF'
          package com.mohammedfadhil.lubaniptv;

          import android.content.Intent;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "NativePlayer")
          public class NativePlayerPlugin extends Plugin {
            @PluginMethod
            public void play(PluginCall call) {
              try {
                JSArray u = call.getArray("urls");
                JSArray t = call.getArray("titles");
                String[] urls = new String[u.length()];
                String[] titles = new String[u.length()];
                for (int i = 0; i < urls.length; i++) {
                  urls[i] = u.getString(i);
                  titles[i] = (t != null && i < t.length()) ? t.getString(i) : "";
                }
                Intent in = new Intent(getActivity(), PlayerActivity.class);
                in.putExtra("urls", urls);
                in.putExtra("titles", titles);
                in.putExtra("index", call.getInt("index", 0));
                in.putExtra("ua", call.getString("ua"));
                getActivity().startActivity(in);
                call.resolve();
              } catch (Exception e) {
                call.reject("fail: " + e.getMessage());
              }
            }
          }
          EOF

          cat > $D/PlayerActivity.java <<'EOF'
          package com.mohammedfadhil.lubaniptv;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.text.TextUtils;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ListView;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.media3.common.C;
          import androidx.media3.common.Format;
          import androidx.media3.common.MediaItem;
          import androidx.media3.common.PlaybackException;
          import androidx.media3.common.Player;
          import androidx.media3.common.TrackSelectionOverride;
          import androidx.media3.common.TrackSelectionParameters;
          import androidx.media3.common.Tracks;
          import androidx.media3.common.VideoSize;
          import androidx.media3.datasource.DefaultHttpDataSource;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.exoplayer.source.DefaultMediaSourceFactory;
          import androidx.media3.ui.PlayerView;
          import java.util.ArrayList;
          import java.util.List;

          public class PlayerActivity extends Activity {
            private ExoPlayer player;
            private PlayerView view;
            private TextView info;
            private LinearLayout bar;
            private ListView list;
            private String[] urls, titles;
            private int idx;
            private boolean triedTs;

            private int dp(int v) {
              return (int) (v * getResources().getDisplayMetrics().density);
            }

            private Button btn(String t, View.OnClickListener l) {
              Button b = new Button(this);
              b.setText(t);
              b.setAllCaps(false);
              b.setOnClickListener(l);
              return b;
            }

            @Override
            protected void onCreate(Bundle saved) {
              super.onCreate(saved);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              urls = getIntent().getStringArrayExtra("urls");
              titles = getIntent().getStringArrayExtra("titles");
              idx = getIntent().getIntExtra("index", 0);
              String ua = getIntent().getStringExtra("ua");

              FrameLayout root = new FrameLayout(this);
              root.setLayoutDirection(View.LAYOUT_DIRECTION_LTR);
              view = new PlayerView(this);
              root.addView(view, new FrameLayout.LayoutParams(-1, -1));

              bar = new LinearLayout(this);
              bar.setOrientation(LinearLayout.HORIZONTAL);
              bar.setGravity(Gravity.CENTER_VERTICAL);
              bar.setBackgroundColor(0xAA000000);
              bar.setPadding(dp(14), dp(6), dp(14), dp(6));
              info = new TextView(this);
              info.setTextColor(Color.WHITE);
              info.setTextSize(14);
              bar.addView(info, new LinearLayout.LayoutParams(0, -2, 1f));
              if (urls.length > 1) bar.addView(btn("☰ القنوات", v -> showList()));
              bar.addView(btn("⚙ الجودة", v -> showQuality()));
              root.addView(bar, new FrameLayout.LayoutParams(-1, -2, Gravity.TOP));

              list = new ListView(this);
              list.setBackgroundColor(0xF0101726);
              list.setVisibility(View.GONE);
              list.setAdapter(new ArrayAdapter<String>(this, android.R.layout.simple_list_item_1, titles) {
                @Override
                public View getView(int pos, View cv, ViewGroup parent) {
                  TextView t = (TextView) super.getView(pos, cv, parent);
                  t.setTextColor(pos == idx ? 0xFFF5A623 : Color.WHITE);
                  t.setBackgroundColor(pos == idx ? 0x33F5A623 : 0);
                  t.setTextSize(14);
                  t.setSingleLine(true);
                  t.setEllipsize(TextUtils.TruncateAt.END);
                  return t;
                }
              });
              list.setOnItemClickListener((p, v, pos, id) -> {
                idx = pos;
                triedTs = false;
                hideList();
                start();
              });
              root.addView(list, new FrameLayout.LayoutParams(dp(300), -1, Gravity.END));
              setContentView(root);
              hideBars();

              DefaultHttpDataSource.Factory f = new DefaultHttpDataSource.Factory()
                  .setUserAgent(ua == null ? "VLC/3.0.20 LibVLC/3.0.20" : ua)
                  .setAllowCrossProtocolRedirects(true)
                  .setConnectTimeoutMs(15000)
                  .setReadTimeoutMs(15000);
              player = new ExoPlayer.Builder(this)
                  .setMediaSourceFactory(new DefaultMediaSourceFactory(f))
                  .build();
              view.setPlayer(player);
              view.setControllerVisibilityListener((PlayerView.ControllerVisibilityListener) vis -> bar.setVisibility(vis));
              player.addListener(new Player.Listener() {
                @Override
                public void onPlayerError(PlaybackException e) {
                  String u = urls[idx];
                  if (!triedTs && u.contains("/live/") && u.endsWith(".m3u8")) {
                    triedTs = true;
                    urls[idx] = u.substring(0, u.length() - 5) + ".ts";
                    start();
                    return;
                  }
                  Toast.makeText(PlayerActivity.this, "Error: " + e.getErrorCodeName(), Toast.LENGTH_LONG).show();
                }

                @Override
                public void onVideoSizeChanged(VideoSize vs) {
                  refreshInfo();
                }

                @Override
                public void onPlaybackStateChanged(int st) {
                  if (st == Player.STATE_READY) refreshInfo();
                }
              });
              start();
            }

            private String name() {
              return (titles != null && idx < titles.length) ? titles[idx] : "";
            }

            private void refreshInfo() {
              StringBuilder s = new StringBuilder(name());
              VideoSize vs = player.getVideoSize();
              if (vs.height > 0) {
                String tag = vs.height >= 2000 ? "4K" : vs.height >= 1000 ? "FHD" : vs.height >= 700 ? "HD" : "SD";
                s.append("  •  ").append(vs.width).append("×").append(vs.height).append(" ").append(tag);
                Format fm = player.getVideoFormat();
                if (fm != null && fm.frameRate > 0) s.append("  •  ").append(Math.round(fm.frameRate)).append("fps");
                if (fm != null && fm.bitrate > 0) s.append("  •  ").append(fm.bitrate / 1000).append(" kbps");
              }
              info.setText(s.toString());
            }

            private void start() {
              player.setMediaItem(MediaItem.fromUri(Uri.parse(urls[idx])));
              player.prepare();
              player.play();
              info.setText(name());
              view.showController();
            }

            private void showList() {
              list.setVisibility(View.VISIBLE);
              ((ArrayAdapter<?>) list.getAdapter()).notifyDataSetChanged();
              list.setSelection(idx);
              list.requestFocus();
            }

            private void hideList() {
              list.setVisibility(View.GONE);
            }

            private void showQuality() {
              List<String> names = new ArrayList<>();
              List<TrackSelectionOverride> ov = new ArrayList<>();
              names.add("تلقائي");
              ov.add(null);
              for (Tracks.Group g : player.getCurrentTracks().getGroups()) {
                if (g.getType() != C.TRACK_TYPE_VIDEO) continue;
                for (int i = 0; i < g.length; i++) {
                  if (!g.isTrackSupported(i)) continue;
                  Format fm = g.getTrackFormat(i);
                  names.add(fm.height + "p" + (fm.bitrate > 0 ? "  (" + (fm.bitrate / 1000) + " kbps)" : ""));
                  ov.add(new TrackSelectionOverride(g.getMediaTrackGroup(), i));
                }
              }
              if (names.size() <= 2) {
                Toast.makeText(this, "هذا البث بجودة واحدة فقط", Toast.LENGTH_SHORT).show();
                return;
              }
              new AlertDialog.Builder(this)
                  .setTitle("الجودة")
                  .setItems(names.toArray(new String[0]), (d, w) -> {
                    TrackSelectionParameters.Builder tb = player.getTrackSelectionParameters()
                        .buildUpon().clearOverridesOfType(C.TRACK_TYPE_VIDEO);
                    if (ov.get(w) != null) tb.addOverride(ov.get(w));
                    player.setTrackSelectionParameters(tb.build());
                  })
                  .show();
            }

            @Override
            public boolean dispatchKeyEvent(KeyEvent e) {
              if (list.getVisibility() == View.VISIBLE) return super.dispatchKeyEvent(e);
              if (e.getAction() == KeyEvent.ACTION_DOWN) {
                int k = e.getKeyCode();
                if (k == KeyEvent.KEYCODE_MENU) {
                  showQuality();
                  return true;
                }
                if (urls.length > 1) {
                  if (k == KeyEvent.KEYCODE_DPAD_UP || k == KeyEvent.KEYCODE_CHANNEL_UP) {
                    idx = (idx - 1 + urls.length) % urls.length;
                    triedTs = false;
                    start();
                    return true;
                  }
                  if (k == KeyEvent.KEYCODE_DPAD_DOWN || k == KeyEvent.KEYCODE_CHANNEL_DOWN) {
                    idx = (idx + 1) % urls.length;
                    triedTs = false;
                    start();
                    return true;
                  }
                  if (k == KeyEvent.KEYCODE_DPAD_LEFT || k == KeyEvent.KEYCODE_DPAD_RIGHT) {
                    showList();
                    return true;
                  }
                }
              }
              return super.dispatchKeyEvent(e);
            }

            @Override
            public void onBackPressed() {
              if (list.getVisibility() == View.VISIBLE) hideList();
              else super.onBackPressed();
            }

            private void hideBars() {
              getWindow().getDecorView().setSystemUiVisibility(
                  View.SYSTEM_UI_FLAG_FULLSCREEN
                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                  | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) hideBars();
            }

            @Override
            protected void onStop() {
              super.onStop();
              if (player != null) player.pause();
            }

            @Override
            protected void onDestroy() {
              super.onDestroy();
              if (player != null) {
                player.release();
                player = null;
              }
            }
          }
          EOF

          cat > $D/MainActivity.java <<'EOF'
          package com.mohammedfadhil.lubaniptv;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(ExternalPlayerPlugin.class);
              registerPlugin(NativePlayerPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          EOF

      - name: Build APK via Gradle
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: Luban-IPTV-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
