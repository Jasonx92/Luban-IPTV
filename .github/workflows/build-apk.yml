name: Build Luban IPTV APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Project and Android Shell
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Luban IPTV" "com.mohammedfadhil.lubaniptv" --web-dir www
          npx cap add android

      - name: Configure Android TV & Cleartext Traffic
        run: |
          # السماح بتشغيل قنوات وروابط البث غير المشفرة HTTP بدون تقطيع
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          # إضافة دعم أجهزة وشاشات التلفزيون الذكية Android TV
          sed -i '/<\/application>/i <banner android:drawable="@mipmap/ic_launcher" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a <uses-feature android:name="android.software.leanback" android:required="false" />\n<uses-feature android:name="android.hardware.touchscreen" android:required="false" />' android/app/src/main/AndroidManifest.xml

      - name: Sync and Compile APK
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleDebug

      - name: Upload Final APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luban-IPTV-v4.5-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
