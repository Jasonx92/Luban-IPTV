name: Build Luban IPTV APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Web Assets and Setup Capacitor
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init "Luban IPTV" "com.mohammedfadhil.lubaniptv" --web-dir www
          npx cap add android

      - name: Configure Android Permissions & TV Support
        run: |
          # السماح بتشغيل روابط البث HTTP و HLS بدون حجب أمني
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          # دعم ريموت الشاشة ونظام Android TV
          sed -i '/<application/a \        <uses-library android:name="org.apache.http.legacy" android:required="false" />' android/app/src/main/AndroidManifest.xml

      - name: Build APK via Gradle
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: Luban-IPTV-v4.5-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
