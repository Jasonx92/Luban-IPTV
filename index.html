<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Luban IPTV</title>
<script src="hls.min.js"></script>
<style>
:root{--bg:#070b13;--panel:#101726;--line:#212b40;--gold:#f5a623;--em:#19c28a;--tx:#eef1f7;--mut:#8f9ab0}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",sans-serif;font-size:14px;overflow:hidden;user-select:none}
button,input{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 14px;cursor:pointer}
input{background:#0b111d;border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:100%;user-select:text}
.f{transition:transform .12s}
.f:focus{outline:3px solid var(--gold);outline-offset:1px;transform:scale(1.04);position:relative;z-index:5}
.scr{position:fixed;inset:0;display:none;flex-direction:column}
.scr.on{display:flex}
.logo{font-weight:800;font-size:20px;color:var(--gold)}
.mut{color:var(--mut);font-size:12px}
#rot{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:18px;font-weight:700}
@media(orientation:portrait){#rot{display:flex}}
/* login */
#login{overflow-y:auto;padding:14px}
.box{width:100%;max-width:400px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:9px}
.tabs{display:flex;gap:8px}.tabs button{flex:1}
.tabs .act{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700}
.pri{background:var(--em);border-color:var(--em);color:#03140d;font-weight:700}
form{display:flex;flex-direction:column;gap:8px}
/* home */
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 20px}
.tiles{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:4px 20px 10px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-radius:18px;font-size:17px;font-weight:700}
.tile i{font-style:normal;font-size:40px}
.t1{background:linear-gradient(160deg,#0d4a39,#101726)}.t2{background:linear-gradient(160deg,#59380a,#101726)}
.t3{background:linear-gradient(160deg,#233468,#101726)}.t4{background:linear-gradient(160deg,#5a1f3a,#101726)}
.foot{display:flex;gap:10px;padding:0 20px 12px}
/* browse */
.row{display:flex;flex:1;min-height:0}
aside{width:180px;flex:none;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:4px}
aside button{flex:none;text-align:right;border-color:transparent;background:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:8px 10px;font-size:13px}
aside button.act{background:#1b2640;border-color:var(--gold);color:var(--gold)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.bar{display:flex;gap:10px;align-items:center;padding:8px 12px;flex:none}
.bar h2{font-size:16px;white-space:nowrap}.bar input{flex:1;min-width:0}
.scroll{flex:1;overflow-y:auto;padding:4px 12px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px}
.grid.live{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.grid.mg{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{padding:0;overflow:hidden;text-align:center;display:flex;flex-direction:column;position:relative}
.pic{aspect-ratio:2/3;background:#0b111d;display:flex;align-items:center;justify-content:center}
.live .pic{aspect-ratio:16/10}
.pic img{width:100%;height:100%;object-fit:cover}
.live .pic img{object-fit:contain;padding:8px}
.card .nm{padding:5px 6px;font-size:11px;line-height:1.4;height:3em;overflow:hidden}
.bd{position:absolute;top:5px;right:5px;background:#000b;color:var(--gold);font-size:11px;font-weight:700;border-radius:8px;padding:2px 6px}
.empty{padding:30px;text-align:center;color:var(--mut);grid-column:1/-1}
#more{display:none;margin:12px auto}
/* matches */
.mc{padding:10px;display:flex;flex-direction:column;gap:8px;text-align:center}
.mc .lg{font-size:11px;color:var(--gold)}
.mc .tm{display:flex;align-items:center;justify-content:space-between;gap:6px}
.mc .tn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.mc img{width:38px;height:38px;object-fit:contain}
.mc .sc{font-weight:800;font-size:16px;min-width:64px}
/* detail */
#detail{overflow:hidden}
#d-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.22;filter:blur(3px)}
.dw{position:relative;display:flex;flex-direction:column;height:100%}
.dc{flex:1;min-height:0;display:flex;gap:18px;padding:0 20px 14px}
#d-poster{width:150px;align-self:flex-start;border-radius:12px;border:1px solid var(--line);aspect-ratio:2/3;object-fit:cover;background:#0b111d}
.di{flex:1;min-width:0;overflow-y:auto;display:flex;flex-direction:column;gap:9px}
.di h1{font-size:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#1b2640;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px}
.chip.g{color:var(--gold);border-color:var(--gold);font-weight:700}
#d-plot{line-height:1.8;font-size:13px}
.ep{font-size:12px;padding:6px 10px}
.epw{display:flex;flex-wrap:wrap;gap:6px}
button.chip{cursor:pointer}
button.chip.act{background:var(--gold);color:#111}
/* player */
#player{background:#000;z-index:20}
#v{width:100%;height:100%;object-fit:contain;background:#000}
#ptop{position:absolute;top:0;left:0;right:0;padding:10px 16px;background:linear-gradient(#000c,transparent);display:flex;gap:10px;align-items:center;opacity:0;transition:opacity .3s}
#player.ui #ptop{opacity:1}
/* modal */
#modal{position:fixed;inset:0;background:#000d;z-index:15;display:none;align-items:center;justify-content:center}
#modal.on{display:flex}
.mbox{width:min(700px,94vw);max-height:90vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
#busy{position:fixed;inset:0;background:#000a;z-index:40;display:none;align-items:center;justify-content:center;font-weight:700}
#busy.on{display:flex}
#toast{position:fixed;bottom:14px;right:50%;transform:translateX(50%);background:#0d4a39;border:1px solid var(--em);padding:8px 16px;border-radius:12px;z-index:50;display:none;font-size:13px}
</style>
</head>
<body>
<div id="rot">📱↻<br>يعمل التطبيق بالوضع الأفقي فقط<br>قم بتدوير الجهاز</div>

<div id="login" class="scr">
  <div class="box">
    <div class="logo">Luban IPTV</div>
    <div id="lerr" style="display:none;background:#3a1620;border:1px solid #e0486a;color:#ffb3c2;border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.6;user-select:text;direction:ltr;text-align:left"></div>
    <div class="tabs">
      <button class="f act" id="t-x" onclick="setType('xtream')">Xtream</button>
      <button class="f" id="t-m" onclick="setType('m3u')">رابط M3U</button>
    </div>
    <form id="f-x" onsubmit="submitLogin(event,'xtream')">
      <input class="f" id="x-host" required placeholder="http://domain.com:8080" dir="ltr" autocapitalize="off">
      <input class="f" id="x-user" required placeholder="اسم المستخدم" dir="ltr" autocapitalize="off">
      <input class="f" id="x-pass" type="password" required placeholder="كلمة المرور" dir="ltr">
      <button class="f pri" type="submit">دخول</button>
    </form>
    <form id="f-m" style="display:none" onsubmit="submitLogin(event,'m3u')">
      <input class="f" id="m-url" required placeholder="http://.../playlist.m3u" dir="ltr" autocapitalize="off">
      <button class="f pri" type="submit">تحميل القائمة</button>
    </form>
  </div>
</div>

<div id="home" class="scr">
  <div class="top"><div><div class="logo">Luban IPTV</div><div class="mut" id="exp"></div></div><div class="mut" id="clock" dir="ltr"></div></div>
  <div class="tiles">
    <button class="f tile t1" onclick="openSec('live')"><i>📺</i>البث المباشر</button>
    <button class="f tile t2" onclick="openSec('movie')"><i>🎬</i>الأفلام</button>
    <button class="f tile t3" onclick="openSec('series')"><i>🍿</i>المسلسلات</button>
    <button class="f tile t4" onclick="openMatches()"><i>⚽</i>مباريات اليوم</button>
  </div>
  <div class="foot"><button class="f" id="b-ext" onclick="toggleExt()"></button><button class="f" onclick="refresh()">تحديث البيانات</button><button class="f" onclick="logout()">تسجيل الخروج</button></div>
</div>

<div id="browse" class="scr">
  <div class="row">
    <aside id="cats"></aside>
    <div class="main">
      <div class="bar"><button class="f" onclick="show('home')">رجوع</button><h2 id="b-title"></h2><input class="f" id="q" placeholder="بحث..." oninput="applyFilter()"></div>
      <div class="scroll"><div id="grid" class="grid"></div><button class="f" id="more" onclick="more()">عرض المزيد</button></div>
    </div>
  </div>
</div>

<div id="matches" class="scr">
  <div class="bar"><button class="f" onclick="show('home')">رجوع</button><h2>مباريات اليوم</h2><span class="mut">اضغط على المباراة لاختيار القناة الناقلة</span></div>
  <div class="scroll"><div id="mgrid" class="grid mg"></div></div>
</div>

<div id="detail" class="scr">
  <div id="d-bg"></div>
  <div class="dw">
    <div class="bar"><button class="f" onclick="show('browse')">رجوع</button></div>
    <div class="dc">
      <img id="d-poster" alt="">
      <div class="di">
        <h1 id="d-title"></h1>
        <div class="chips" id="d-meta"></div>
        <div id="d-plot"></div>
        <div class="mut" id="d-cast"></div>
        <div id="d-act" class="epw"></div>
        <div id="d-seasons" class="epw"></div>
        <div id="d-eps" class="epw"></div>
      </div>
    </div>
  </div>
</div>

<div id="player" class="scr">
  <video id="v" playsinline controls autoplay></video>
  <div id="ptop"><button class="f" onclick="closePlayer()">رجوع</button><button class="f" onclick="openVLC()">فتح في VLC</button><b id="p-title"></b></div>
</div>

<div id="modal"><div class="mbox"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px"><b id="m-title"></b><button class="f" onclick="closeModal()">إغلاق</button></div><div class="mut" id="m-note" style="margin-bottom:8px"></div><div id="m-body" class="epw"></div></div></div>
<div id="busy">جاري التحميل...</div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],enc=encodeURIComponent;
const SEC={live:{t:'البث المباشر',c:'get_live_categories',s:'get_live_streams'},movie:{t:'الأفلام',c:'get_vod_categories',s:'get_vod_streams'},series:{t:'المسلسلات',c:'get_series_categories',s:'get_series'}};
let cfg=null,curUrl='',curTitle='',useExt=localStorage.getItem('luban_ext')==='1',D={},cur='live',catId='all',hls=null,filt=[],shown=0,curList=[],curIdx=-1,zap=false,retScr='home',q=[],qt,tTimer,uTimer,TR={},curIt=null;
try{cfg=JSON.parse(localStorage.getItem('luban'))}catch(e){}
try{TR=JSON.parse(localStorage.getItem('luban_tr')||'{}')}catch(e){}

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tTimer);tTimer=setTimeout(()=>t.style.display='none',3500)}
function busy(on){$('#busy').classList.toggle('on',!!on)}
function show(id){
  $$('.scr').forEach(s=>s.classList.toggle('on',s.id===id));
  setTimeout(()=>{if(id==='player')return;const r=$('#'+id);const f=r.querySelector(id==='browse'?'#grid .f':id==='detail'?'#d-act .f':'.f')||r.querySelector('.f');if(f)f.focus()},60)}
function setType(t){$('#f-x').style.display=t==='xtream'?'flex':'none';$('#f-m').style.display=t==='m3u'?'flex':'none';$('#t-x').classList.toggle('act',t==='xtream');$('#t-m').classList.toggle('act',t==='m3u')}
const fixHost=h=>{h=h.trim().replace(/\/+$/,'');return /^https?:\/\//i.test(h)?h:'http://'+h};
function submitLogin(e,type){e.preventDefault();doLogin(type==='xtream'?{type,host:fixHost($('#x-host').value),user:$('#x-user').value.trim(),pass:$('#x-pass').value}:{type,url:$('#m-url').value.trim()})}

async function api(a,x=''){
  const nat=window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform();
  const r=await fetch(`${cfg.host}/player_api.php?username=${enc(cfg.user)}&password=${enc(cfg.pass)}${a?'&action='+a:''}${x}`,nat?{headers:{'User-Agent':'VLC/3.0.20 LibVLC/3.0.20'}}:{});
  if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}

async function loadM3U(){
  const t=await(await fetch(cfg.url)).text(),items=[],cats={};let m=null;
  for(const l of t.split(/\r?\n/)){
    if(l.startsWith('#EXTINF')){m={t:'live',name:(l.split(',').pop()||'').trim(),logo:(l.match(/tvg-logo="([^"]*)"/)||[])[1],cat:(l.match(/group-title="([^"]*)"/)||[])[1]||'عام'}}
    else if(m&&l.trim()&&!l.startsWith('#')){m.url=l.trim();cats[m.cat]=1;items.push(m);m=null}}
  if(!items.length)throw 'الملف لا يحتوي على قنوات';
  D.live={cats:Object.keys(cats).map(n=>({id:n,name:n})),items}}

async function doLogin(c){
  const old=cfg;cfg=c;D={};busy(1);$('#lerr').style.display='none';
  try{
    if(c.type==='m3u')await loadM3U();
    else{
      let j;
      try{j=await api('')}catch(e){
        if(cfg.host.startsWith('https://')){cfg.host=cfg.host.replace('https://','http://');j=await api('')}else throw e}
      if(!j.user_info||j.user_info.auth!=1)throw 'بيانات الدخول غير صحيحة';cfg.exp=j.user_info.exp_date}
    localStorage.setItem('luban',JSON.stringify(cfg));
    $('#exp').textContent=cfg.exp?'ينتهي الاشتراك: '+new Date(cfg.exp*1000).toLocaleDateString('ar'):'';
    show('home')
  }catch(e){const em=typeof e==='string'?e:'تعذر الاتصال بالسيرفر'+(e&&e.message?' ('+e.message+')':'');toast(em);const le=$('#lerr');le.textContent=em+(typeof e==='string'?'':' | '+(c.host||c.url||''));le.style.display='block';cfg=old&&old!==c?old:null;if(!$('#home.on'))show('login')}
  busy(0)}

async function load(sec){
  if(D[sec])return;
  const S=SEC[sec],[c,s]=await Promise.all([api(S.c),api(S.s)]);
  D[sec]={cats:c.map(x=>({id:String(x.category_id),name:x.category_name})),items:s.map(x=>({t:sec,name:x.name,logo:x.stream_icon||x.cover,cat:String(x.category_id),id:x.stream_id||x.series_id,ext:x.container_extension,rating:x.rating}))}}

async function openSec(sec){
  if(cfg.type==='m3u'&&sec!=='live')return toast('الأفلام والمسلسلات غير متوفرة مع روابط M3U');
  busy(1);
  try{await load(sec);cur=sec;catId='all';$('#b-title').textContent=SEC[sec].t;$('#q').value='';$('#grid').className='grid'+(sec==='live'?' live':'');renderCats();applyFilter();show('browse')}
  catch(e){toast('فشل تحميل البيانات')}
  busy(0)}

function renderCats(){
  const a=$('#cats');a.innerHTML='';
  [{id:'all',name:'الكل'},...D[cur].cats].forEach(c=>{
    const b=document.createElement('button');b.className='f'+(c.id===catId?' act':'');b.textContent=c.name;
    b.onclick=()=>{catId=c.id;$$('#cats button').forEach(x=>x.classList.remove('act'));b.classList.add('act');applyFilter()};a.append(b)})}

function applyFilter(){
  const s=$('#q').value.trim().toLowerCase();
  filt=D[cur].items.filter(i=>(catId==='all'||i.cat===catId)&&(!s||(i.name||'').toLowerCase().includes(s)));
  shown=0;$('#grid').innerHTML='';
  if(!filt.length){$('#grid').innerHTML='<div class="empty">لا توجد نتائج</div>';$('#more').style.display='none';return}
  more()}
function more(){
  const g=$('#grid');
  filt.slice(shown,shown+100).forEach(it=>g.append(card(it)));
  shown=Math.min(shown+100,filt.length);
  $('#more').style.display=shown<filt.length?'block':'none'}

function card(it){
  const b=document.createElement('button');b.className='f card';
  const p=document.createElement('div');p.className='pic';
  if(it.logo){const i=new Image();i.loading='lazy';i.src=it.logo;i.onerror=()=>i.remove();p.append(i)}
  const d=document.createElement('div');d.className='nm';d.textContent=it.name;
  b.append(p,d);
  if(+it.rating>0){const r=document.createElement('div');r.className='bd';r.textContent='⭐ '+(+it.rating).toFixed(1);b.append(r)}
  b.onclick=()=>pick(it);return b}

function urlFor(it){
  if(it.url)return it.url;
  const b=`${cfg.host}/${it.t==='live'?'live':'movie'}/${enc(cfg.user)}/${enc(cfg.pass)}/${it.id}`;
  return it.t==='live'?b+'.m3u8':b+'.'+(it.ext||'mp4')}

function pick(it){
  if(it.t==='live'){zap=true;curList=filt;curIdx=filt.indexOf(it);return play(it.name,urlFor(it))}
  openDetail(it)}

/* details: story (auto-translated), rating, play */
async function tr(t){
  if(/[\u0600-\u06FF]/.test(t))return t;
  const k=t.length+t.slice(0,60);if(TR[k])return TR[k];
  try{
    const j=await(await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ar&dt=t&q='+enc(t.slice(0,1500)))).json();
    const o=j[0].map(x=>x[0]).join('');TR[k]=o;
    try{localStorage.setItem('luban_tr',JSON.stringify(TR))}catch(e){}
    return o}catch(e){return t}}

async function openDetail(it){
  busy(1);
  try{
    let info={},eps=null;
    if(it.t==='movie'){const j=await api('get_vod_info','&vod_id='+it.id);info=j.info||{};if(j.movie_data&&j.movie_data.container_extension)it.ext=j.movie_data.container_extension}
    else{const j=await api('get_series_info','&series_id='+it.id);info=j.info||{};eps=j.episodes||{}}
    renderDetail(it,info,eps);show('detail')
  }catch(e){toast('تعذر تحميل التفاصيل')}
  busy(0)}

function renderDetail(it,info,eps){
  curIt=it;
  const bg=[].concat(info.backdrop_path||[])[0],img=info.movie_image||info.cover||it.logo||'';
  $('#d-bg').style.backgroundImage=bg?'url('+JSON.stringify(bg)+')':'none';
  const po=$('#d-poster');po.src=img;po.style.display=img?'block':'none';
  $('#d-title').textContent=it.name;
  const m=$('#d-meta');m.innerHTML='';
  const r=+(info.rating||it.rating||0),yr=String(info.releasedate||info.releaseDate||'').slice(0,4);
  const add=(t,c)=>{if(!t)return;const s=document.createElement('span');s.className='chip'+(c?' g':'');s.textContent=t;m.append(s)};
  if(r>0)add('⭐ '+r.toFixed(1)+' / 10',1);
  add(/^\d{4}$/.test(yr)?yr:'');add(info.duration);add(info.genre);
  const p=info.plot||info.description||'';
  const pl=$('#d-plot');pl.textContent=p?'جاري ترجمة القصة...':'لا يوجد وصف متاح';
  if(p)tr(p).then(t=>{if(curIt===it)pl.textContent=t});
  $('#d-cast').textContent=[info.director?'الإخراج: '+info.director:'',info.cast?'التمثيل: '+info.cast:''].filter(Boolean).join('\n');
  $('#d-cast').style.whiteSpace='pre-line';
  const act=$('#d-act'),ss=$('#d-seasons'),ew=$('#d-eps');act.innerHTML=ss.innerHTML=ew.innerHTML='';
  if(it.t==='movie'){
    const b=document.createElement('button');b.className='f pri';b.textContent='▶ تشغيل الفيلم';
    b.onclick=()=>{zap=false;play(it.name,urlFor(it))};act.append(b)}
  else{
    const keys=Object.keys(eps).sort((a,b)=>a-b);
    keys.forEach((s,i)=>{
      const b=document.createElement('button');b.className='f chip'+(i?'':' act');b.textContent='الموسم '+s;
      b.onclick=()=>{$$('#d-seasons button').forEach(x=>x.classList.remove('act'));b.classList.add('act');renderSeason(it,eps,s)};ss.append(b)});
    if(keys.length)renderSeason(it,eps,keys[0]);else ew.textContent='لا توجد حلقات'}}

function renderSeason(it,eps,s){
  const w=$('#d-eps');w.innerHTML='';
  (eps[s]||[]).forEach(e=>{
    const b=document.createElement('button');b.className='f ep';b.textContent=(e.episode_num||'')+'. '+(e.title||'حلقة');
    b.onclick=()=>{zap=false;play(it.name+' - '+b.textContent,`${cfg.host}/series/${enc(cfg.user)}/${enc(cfg.pass)}/${e.id}.${e.container_extension||'mp4'}`)};w.append(b)})}

/* today's matches */
const tsOf=e=>{let s=e.strTimestamp||(e.dateEvent+'T'+(e.strTime||'00:00:00'));if(!/Z|\+/.test(s))s+='Z';return new Date(s)};
async function openMatches(){
  show('matches');const g=$('#mgrid');g.innerHTML='<div class="empty">جاري تحميل المباريات...</div>';
  try{
    const d=new Date().toLocaleDateString('en-CA');
    const j=await(await fetch(`https://www.thesportsdb.com/api/v1/json/123/eventsday.php?d=${d}&s=Soccer`)).json();
    const ev=(j.events||[]).sort((a,b)=>tsOf(a)-tsOf(b));g.innerHTML='';
    if(!ev.length){g.innerHTML='<div class="empty">لا توجد مباريات مسجلة لهذا اليوم</div>';return}
    ev.forEach(e=>g.append(mcard(e)));const f=g.querySelector('.f');if(f)f.focus()
  }catch(e){g.innerHTML='<div class="empty">تعذر تحميل المباريات، تحقق من الإنترنت</div>'}}

function mcard(e){
  const b=document.createElement('button');b.className='f card mc';
  const lg=document.createElement('div');lg.className='lg';lg.textContent=e.strLeague||'';
  const row=document.createElement('div');row.className='tm';
  const team=(n,img)=>{const t=document.createElement('div');t.className='tn';if(img){const i=new Image();i.src=img;i.onerror=()=>i.remove();t.append(i)}const s=document.createElement('span');s.textContent=n;t.append(s);return t};
  const sc=document.createElement('div');sc.className='sc';
  sc.textContent=(e.intHomeScore!=null&&e.intAwayScore!=null)?e.intHomeScore+' - '+e.intAwayScore:tsOf(e).toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'});
  row.append(team(e.strHomeTeam,e.strHomeTeamBadge),sc,team(e.strAwayTeam,e.strAwayTeamBadge));
  const go=document.createElement('div');go.className='mut';go.textContent='اختيار القناة الناقلة ◀';
  b.append(lg,row,go);b.onclick=()=>pickChannel(e);return b}

async function pickChannel(e){
  if(cfg.type!=='m3u'){busy(1);try{await load('live')}catch(x){busy(0);return toast('فشل تحميل القنوات')}busy(0)}
  const rx=/bein|بي ان|ssc|sport|osn|ad sport|abu dhabi|dubai sport|thmanyah|ثمانية|الكاس|kass/i;
  const list=D.live.items.filter(i=>rx.test(i.name)).slice(0,80);
  if(!list.length)return toast('لا توجد قنوات رياضية في اشتراكك');
  $('#m-title').textContent=e.strHomeTeam+' × '+e.strAwayTeam;
  $('#m-note').textContent='اختر القناة الناقلة، التطبيق لا يعرف القناة الناقلة تلقائياً';
  const body=$('#m-body');body.innerHTML='';
  list.forEach((it,i)=>{const b=document.createElement('button');b.className='f ep';b.textContent=it.name;
    b.onclick=()=>{closeModal();zap=true;curList=list;curIdx=i;play(it.name,urlFor(it))};body.append(b)});
  $('#modal').classList.add('on');setTimeout(()=>{const f=$('#m-body .f');if(f)f.focus()},50)}
function closeModal(){$('#modal').classList.remove('on')}

/* player: native first, then hls.js, then raw .ts */
function play(title,url){
  curUrl=url;curTitle=title;
  if(useExt&&window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform())return openVLC();
  $('#p-title').textContent=title;
  const on=$('.scr.on');if(on&&on.id!=='player')retScr=on.id;
  $$('.scr').forEach(s=>s.classList.toggle('on',s.id==='player'));
  q=[{k:'n',u:url}];
  if(/\.m3u8(\?|$)/i.test(url)){
    if(window.Hls&&Hls.isSupported())q.push({k:'h',u:url});
    if(/\/live\//.test(url))q.push({k:'n',u:url.replace(/\.m3u8/,'.ts')})}
  tryNext();flash()}
function tryNext(){
  clearTimeout(qt);if(hls){hls.destroy();hls=null}
  const v=$('#v'),s=q.shift();
  if(!s){v.removeAttribute('src');v.load();return toast('تعذر تشغيل هذا البث، جرّب زر VLC أو قناة أخرى')}
  if(s.k==='h'){hls=new Hls({maxBufferLength:20});hls.loadSource(s.u);hls.attachMedia(v);hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)tryNext()})}
  else v.src=s.u;
  v.play().catch(()=>{});
  qt=setTimeout(()=>{if(v.readyState<2)tryNext()},9000)}
$('#v').onerror=()=>tryNext();
$('#v').onplaying=()=>clearTimeout(qt);
async function openVLC(){
  if(!(window.Capacitor&&Capacitor.registerPlugin))return toast('المشغّل الخارجي يعمل داخل التطبيق فقط');
  const v=$('#v');v.pause();
  try{await Capacitor.registerPlugin('ExternalPlayer').play({url:curUrl,title:curTitle,package:'org.videolan.vlc'})}
  catch(e){toast(e&&e.message==='not_installed'?'ثبّت VLC من متجر Play أولاً':'تعذر فتح المشغّل الخارجي')}}
function updExt(){$('#b-ext').textContent='المشغّل: '+(useExt?'VLC الخارجي':'الداخلي')}
function toggleExt(){useExt=!useExt;localStorage.setItem('luban_ext',useExt?'1':'0');updExt();toast(useExt?'سيتم التشغيل عبر VLC':'سيتم التشغيل داخل التطبيق')}
function flash(){const p=$('#player');p.classList.add('ui');clearTimeout(uTimer);uTimer=setTimeout(()=>p.classList.remove('ui'),4000)}
function closePlayer(){q=[];clearTimeout(qt);const v=$('#v');v.pause();if(hls){hls.destroy();hls=null}v.removeAttribute('src');v.load();show(retScr)}

function refresh(){D={};if(cfg.type==='m3u'){busy(1);loadM3U().then(()=>toast('تم التحديث')).catch(()=>toast('فشل التحديث')).finally(()=>busy(0))}else toast('سيُعاد تحميل البيانات عند فتح كل قسم')}
function logout(){localStorage.removeItem('luban');cfg=null;D={};show('login')}

/* remote / D-pad */
function move(d){
  const root=$('#modal.on')||$('.scr.on');
  const els=$$('.f').filter(e=>root.contains(e)&&e.offsetParent);
  const a=document.activeElement;
  if(!els.includes(a)){if(els[0])els[0].focus();return}
  const r=a.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,bs=1e9;
  for(const e of els){if(e===a)continue;
    const b=e.getBoundingClientRect(),x=b.left+b.width/2-cx,y=b.top+b.height/2-cy;let p,s;
    if(d==='ArrowRight'){p=x;s=y}else if(d==='ArrowLeft'){p=-x;s=y}else if(d==='ArrowDown'){p=y;s=x}else{p=-y;s=x}
    if(p<=2)continue;const sc=p+Math.abs(s)*2;if(sc<bs){bs=sc;best=e}}
  if(best){best.focus();best.scrollIntoView({block:'nearest'})}}
function goBack(){
  if($('#modal.on'))return closeModal();
  if($('#player.on'))return closePlayer();
  if($('#detail.on'))return show('browse');
  if($('#browse.on')||$('#matches.on'))return show('home')}
addEventListener('keydown',e=>{
  const k=e.key,inInput=document.activeElement&&document.activeElement.tagName==='INPUT';
  if(k==='Escape'||k==='GoBack'||(k==='Backspace'&&!inInput)){e.preventDefault();return goBack()}
  if($('#player.on')){
    if(zap&&curList.length>1&&(k==='ArrowUp'||k==='ArrowDown')){
      e.preventDefault();curIdx=(curIdx+(k==='ArrowDown'?1:-1)+curList.length)%curList.length;
      const it=curList[curIdx];play(it.name,urlFor(it))}
    else flash();return}
  if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k))return;
  if(inInput&&(k==='ArrowLeft'||k==='ArrowRight'))return;
  e.preventDefault();move(k)});

function tick(){$('#clock').textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}
tick();updExt();setInterval(tick,30000);
if(cfg)doLogin(cfg);else show('login');
</script>
