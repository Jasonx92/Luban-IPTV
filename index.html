<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>لبان اي بي تي في</title>
<script src="hls.min.js"></script>
<style>
:root{--bg:#0a0e17;--panel:#121826;--line:#232c3f;--gold:#f59e0b;--em:#10b981;--tx:#e8ecf4;--mut:#8b95a9}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;overflow:hidden;user-select:none}
button,input{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 16px;cursor:pointer}
input{background:#0d1320;border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;user-select:text}
.f{transition:transform .15s,box-shadow .15s}
.f:focus{outline:3px solid var(--gold);outline-offset:2px;transform:scale(1.04);z-index:5;position:relative}
.scr{position:fixed;inset:0;display:none;flex-direction:column}
.scr.on{display:flex}
.logo{font-weight:800;font-size:22px;color:var(--gold)}
.mut{color:var(--mut);font-size:13px}
/* login */
#login{align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px;display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;gap:8px}.tabs button{flex:1}
.tabs button.act{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700}
.pri{background:var(--em);border-color:var(--em);color:#04150f;font-weight:700}
form{display:flex;flex-direction:column;gap:10px}
/* home */
#home header{display:flex;justify-content:space-between;align-items:center;padding:18px 28px}
.tiles{flex:1;display:flex;gap:18px;padding:10px 28px 18px}
.tile{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border-radius:22px;font-size:22px;font-weight:700;border:1px solid var(--line)}
.tile i{font-style:normal;font-size:54px}
.tile.live{background:linear-gradient(160deg,#0c3b2e,#121826)}
.tile.movie{background:linear-gradient(160deg,#4a2e07,#121826)}
.tile.series{background:linear-gradient(160deg,#1c2a52,#121826)}
.foot{display:flex;gap:10px;padding:0 28px 22px}
/* browse */
.row{display:flex;flex:1;min-height:0}
aside{width:230px;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
aside button{text-align:right;border-color:transparent;background:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
aside button.act{background:#1d2740;border-color:var(--gold);color:var(--gold)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.bar{display:flex;gap:10px;align-items:center;padding:12px 16px}
.bar h2{font-size:18px;white-space:nowrap}.bar input{max-width:340px}
.scroll{flex:1;overflow-y:auto;padding:6px 16px 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.grid.live{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.card{padding:0;overflow:hidden;text-align:center;display:flex;flex-direction:column}
.pic{aspect-ratio:2/3;background:#0d1320;display:flex;align-items:center;justify-content:center}
.live .pic{aspect-ratio:16/10}
.pic img{width:100%;height:100%;object-fit:cover}
.live .pic img{object-fit:contain;padding:12px}
.card div:last-child{padding:8px;font-size:12px;line-height:1.4;height:3.1em;overflow:hidden}
.empty{padding:40px;text-align:center;color:var(--mut)}
#more{display:none;margin:16px auto}
/* player */
#player{background:#000;z-index:20}
#v{width:100%;height:100%;object-fit:contain;background:#000}
#ptop{position:absolute;top:0;left:0;right:0;padding:16px 20px;background:linear-gradient(#000c,transparent);display:flex;gap:12px;align-items:center;opacity:0;transition:opacity .3s}
#player.ui #ptop{opacity:1}
/* modal */
#eps-modal{position:fixed;inset:0;background:#000d;z-index:15;display:none;align-items:center;justify-content:center}
#eps-modal.on{display:flex}
.mbox{width:min(780px,94vw);max-height:86vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}
.mbox h4{margin:14px 0 8px;color:var(--gold)}
.epw{display:flex;flex-wrap:wrap;gap:8px}.ep{font-size:13px}
#busy{position:fixed;inset:0;background:#000a;z-index:40;display:none;align-items:center;justify-content:center;font-weight:700}
#busy.on{display:flex}
#toast{position:fixed;bottom:22px;right:50%;transform:translateX(50%);background:#0c3b2e;border:1px solid var(--em);padding:10px 18px;border-radius:14px;z-index:50;display:none;font-size:14px}
@media(max-width:700px){aside{width:120px}.tiles{flex-direction:column}.tile i{font-size:36px}.tile{font-size:18px}}
</style>
</head>
<body>

<div id="login" class="scr">
  <div class="box">
    <div class="logo">لبان اي بي تي في</div>
    <div class="mut">سجّل الدخول لعرض القنوات والأفلام والمسلسلات</div>
    <div class="tabs">
      <button class="f act" id="t-x" onclick="setType('xtream')">Xtream</button>
      <button class="f" id="t-m" onclick="setType('m3u')">رابط M3U</button>
    </div>
    <form id="f-x" onsubmit="submitLogin(event,'xtream')">
      <input class="f" id="x-host" required placeholder="http://domain.com:8080" dir="ltr" autocapitalize="off">
      <input class="f" id="x-user" required placeholder="اسم المستخدم" dir="ltr" autocapitalize="off">
      <input class="f" id="x-pass" type="password" required placeholder="كلمة المرور" dir="ltr">
      <button class="f pri" type="submit">دخول</button>
    </form>
    <form id="f-m" style="display:none" onsubmit="submitLogin(event,'m3u')">
      <input class="f" id="m-url" required placeholder="http://.../playlist.m3u" dir="ltr" autocapitalize="off">
      <button class="f pri" type="submit">تحميل القائمة</button>
    </form>
  </div>
</div>

<div id="home" class="scr">
  <header>
    <div><div class="logo">لبان اي بي تي في</div><div class="mut" id="exp"></div></div>
    <div class="mut" id="clock" dir="ltr"></div>
  </header>
  <div class="tiles">
    <button class="f tile live" onclick="openSec('live')"><i>📺</i>البث المباشر</button>
    <button class="f tile movie" onclick="openSec('movie')"><i>🎬</i>الأفلام</button>
    <button class="f tile series" onclick="openSec('series')"><i>🍿</i>المسلسلات</button>
  </div>
  <div class="foot">
    <button class="f" onclick="refresh()">تحديث البيانات</button>
    <button class="f" onclick="logout()">تسجيل الخروج</button>
  </div>
</div>

<div id="browse" class="scr">
  <div class="row">
    <aside id="cats"></aside>
    <div class="main">
      <div class="bar">
        <button class="f" onclick="show('home')">رجوع</button>
        <h2 id="b-title"></h2>
        <input class="f" id="q" placeholder="بحث..." oninput="applyFilter()">
      </div>
      <div class="scroll">
        <div id="grid" class="grid"></div>
        <button class="f" id="more" onclick="more()">عرض المزيد</button>
      </div>
    </div>
  </div>
</div>

<div id="player" class="scr">
  <video id="v" playsinline controls autoplay></video>
  <div id="ptop"><button class="f" onclick="closePlayer()">رجوع</button><b id="p-title"></b></div>
</div>

<div id="eps-modal"><div class="mbox"><div style="display:flex;justify-content:space-between;align-items:center"><b id="eps-title"></b><button class="f" onclick="closeEps()">إغلاق</button></div><div id="eps"></div></div></div>
<div id="busy">جاري التحميل...</div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const SEC={live:{t:'البث المباشر',c:'get_live_categories',s:'get_live_streams'},movie:{t:'الأفلام',c:'get_vod_categories',s:'get_vod_streams'},series:{t:'المسلسلات',c:'get_series_categories',s:'get_series'}};
let cfg=null,D={},cur='live',catId='all',hls=null,filt=[],shown=0,curList=[],curIdx=-1,tTimer,uTimer;
try{cfg=JSON.parse(localStorage.getItem('luban'))}catch(e){}

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tTimer);tTimer=setTimeout(()=>t.style.display='none',3500)}
function busy(on){$('#busy').classList.toggle('on',!!on)}
function show(id){$$('.scr').forEach(s=>s.classList.toggle('on',s.id===id));setTimeout(()=>{const r=$('#'+id);const f=r.querySelector(id==='browse'?'#grid .f':'.f')||r.querySelector('.f');if(f&&id!=='player')f.focus()},50)}
function setType(t){$('#f-x').style.display=t==='xtream'?'flex':'none';$('#f-m').style.display=t==='m3u'?'flex':'none';$('#t-x').classList.toggle('act',t==='xtream');$('#t-m').classList.toggle('act',t==='m3u')}
const fixHost=h=>{h=h.trim().replace(/\/+$/,'');return /^https?:\/\//i.test(h)?h:'http://'+h};

function submitLogin(e,type){e.preventDefault();doLogin(type==='xtream'?{type,host:fixHost($('#x-host').value),user:$('#x-user').value.trim(),pass:$('#x-pass').value}:{type,url:$('#m-url').value.trim()})}

async function api(a,x=''){
  const r=await fetch(`${cfg.host}/player_api.php?username=${encodeURIComponent(cfg.user)}&password=${encodeURIComponent(cfg.pass)}${a?'&action='+a:''}${x}`);
  if(!r.ok)throw 0;return r.json()}

async function loadM3U(){
  const t=await(await fetch(cfg.url)).text(),items=[],cats={};let m=null;
  for(const l of t.split(/\r?\n/)){
    if(l.startsWith('#EXTINF')){m={name:(l.split(',').pop()||'').trim(),logo:(l.match(/tvg-logo="([^"]*)"/)||[])[1],cat:(l.match(/group-title="([^"]*)"/)||[])[1]||'عام'}}
    else if(m&&l.trim()&&!l.startsWith('#')){m.url=l.trim();cats[m.cat]=1;items.push(m);m=null}}
  if(!items.length)throw 'الملف لا يحتوي على قنوات';
  D.live={cats:Object.keys(cats).map(n=>({id:n,name:n})),items}}

async function doLogin(c){
  const old=cfg;cfg=c;D={};busy(1);
  try{
    if(c.type==='m3u')await loadM3U();
    else{const j=await api('');if(!j.user_info||j.user_info.auth!=1)throw 'بيانات الدخول غير صحيحة';cfg.exp=j.user_info.exp_date}
    localStorage.setItem('luban',JSON.stringify(cfg));
    $('#exp').textContent=cfg.exp?'ينتهي الاشتراك: '+new Date(cfg.exp*1000).toLocaleDateString('ar'):'';
    show('home')
  }catch(e){toast(typeof e==='string'?e:'تعذر الاتصال بالسيرفر، تحقق من البيانات والإنترنت');cfg=old&&old!==c?old:null;if(!$('#home').classList.contains('on'))show('login')}
  busy(0)}

async function load(sec){
  if(D[sec])return;
  const S=SEC[sec],[c,s]=await Promise.all([api(S.c),api(S.s)]);
  D[sec]={cats:c.map(x=>({id:String(x.category_id),name:x.category_name})),items:s.map(x=>({name:x.name,logo:x.stream_icon||x.cover,cat:String(x.category_id),id:x.stream_id||x.series_id,ext:x.container_extension}))}}

async function openSec(sec){
  if(cfg.type==='m3u'&&sec!=='live')return toast('الأفلام والمسلسلات غير متوفرة مع روابط M3U');
  busy(1);
  try{await load(sec);cur=sec;catId='all';$('#b-title').textContent=SEC[sec].t;$('#q').value='';$('#grid').className='grid'+(sec==='live'?' live':'');renderCats();applyFilter();show('browse')}
  catch(e){toast('فشل تحميل البيانات')}
  busy(0)}

function renderCats(){
  const a=$('#cats');a.innerHTML='';
  [{id:'all',name:'الكل'},...D[cur].cats].forEach(c=>{
    const b=document.createElement('button');b.className='f'+(c.id===catId?' act':'');b.textContent=c.name;
    b.onclick=()=>{catId=c.id;$$('#cats button').forEach(x=>x.classList.remove('act'));b.classList.add('act');applyFilter()};a.append(b)})}

function applyFilter(){
  const q=$('#q').value.trim().toLowerCase();
  filt=D[cur].items.filter(i=>(catId==='all'||i.cat===catId)&&(!q||(i.name||'').toLowerCase().includes(q)));
  shown=0;$('#grid').innerHTML='';
  if(!filt.length){$('#grid').innerHTML='<div class="empty">لا توجد نتائج</div>';$('#more').style.display='none';return}
  more()}

function more(){
  const g=$('#grid');
  filt.slice(shown,shown+120).forEach(it=>g.append(card(it)));
  shown=Math.min(shown+120,filt.length);
  $('#more').style.display=shown<filt.length?'block':'none'}

function card(it){
  const b=document.createElement('button');b.className='f card';
  const p=document.createElement('div');p.className='pic';
  if(it.logo){const i=new Image();i.loading='lazy';i.src=it.logo;i.onerror=()=>i.remove();p.append(i)}
  const d=document.createElement('div');d.textContent=it.name;
  b.append(p,d);b.onclick=()=>pick(it);return b}

function urlFor(it){
  if(it.url)return it.url;
  const b=`${cfg.host}/${cur==='live'?'live':'movie'}/${encodeURIComponent(cfg.user)}/${encodeURIComponent(cfg.pass)}/${it.id}`;
  return cur==='live'?b+'.m3u8':b+'.'+(it.ext||'mp4')}

function pick(it){
  if(cur==='series')return openSeries(it);
  curList=cur==='live'?filt:[it];curIdx=curList.indexOf(it);play(it.name,urlFor(it))}

async function openSeries(it){
  busy(1);
  try{
    const j=await api('get_series_info','&series_id='+it.id),eps=j.episodes||{},box=$('#eps');
    box.innerHTML='';$('#eps-title').textContent=it.name;
    Object.keys(eps).forEach(s=>{
      const h=document.createElement('h4');h.textContent='الموسم '+s;const w=document.createElement('div');w.className='epw';
      (eps[s]||[]).forEach(e=>{
        const b=document.createElement('button');b.className='f ep';b.textContent=(e.episode_num||'')+' - '+(e.title||'حلقة');
        b.onclick=()=>{closeEps();play(it.name+' - '+b.textContent,`${cfg.host}/series/${encodeURIComponent(cfg.user)}/${encodeURIComponent(cfg.pass)}/${e.id}.${e.container_extension||'mp4'}`)};w.append(b)});
      box.append(h,w)});
    if(!box.children.length)throw 0;
    $('#eps-modal').classList.add('on');setTimeout(()=>{const f=$('#eps .f');if(f)f.focus()},50)
  }catch(e){toast('لا توجد حلقات متاحة')}
  busy(0)}
function closeEps(){$('#eps-modal').classList.remove('on')}

function play(title,url){
  $('#p-title').textContent=title;
  $$('.scr').forEach(s=>s.classList.toggle('on',s.id==='player'));
  const v=$('#v');if(hls){hls.destroy();hls=null}
  if(/\.m3u8(\?|$)/i.test(url)&&window.Hls&&Hls.isSupported()){
    hls=new Hls();hls.loadSource(url);hls.attachMedia(v);
    hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)toast('تعذر تشغيل هذا البث')})
  }else v.src=url;
  v.onerror=()=>toast('تعذر تشغيل هذا البث');
  v.play().catch(()=>{});flash()}
function flash(){const p=$('#player');p.classList.add('ui');clearTimeout(uTimer);uTimer=setTimeout(()=>p.classList.remove('ui'),4000)}
function closePlayer(){const v=$('#v');v.pause();v.removeAttribute('src');v.load();if(hls){hls.destroy();hls=null}show('browse')}

function refresh(){D={};if(cfg.type==='m3u'){busy(1);loadM3U().then(()=>toast('تم التحديث')).catch(()=>toast('فشل التحديث')).finally(()=>busy(0))}else toast('تم مسح البيانات المخزنة، سيُعاد التحميل عند فتح كل قسم')}
function logout(){localStorage.removeItem('luban');cfg=null;D={};show('login')}

/* D-pad / remote navigation */
function move(d){
  const root=$('#eps-modal.on')||$('.scr.on');
  const els=$$('.f').filter(e=>root.contains(e)&&e.offsetParent);
  const a=document.activeElement;
  if(!els.includes(a)){if(els[0])els[0].focus();return}
  const r=a.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,bs=1e9;
  for(const e of els){if(e===a)continue;
    const q=e.getBoundingClientRect(),x=q.left+q.width/2-cx,y=q.top+q.height/2-cy;let p,s;
    if(d==='ArrowRight'){p=x;s=y}else if(d==='ArrowLeft'){p=-x;s=y}else if(d==='ArrowDown'){p=y;s=x}else{p=-y;s=x}
    if(p<=2)continue;const sc=p+Math.abs(s)*2;if(sc<bs){bs=sc;best=e}}
  if(best){best.focus();best.scrollIntoView({block:'nearest'})}}

function goBack(){
  if($('#eps-modal.on'))return closeEps();
  if($('#player.on'))return closePlayer();
  if($('#browse.on'))return show('home')}

addEventListener('keydown',e=>{
  const k=e.key,inInput=document.activeElement&&document.activeElement.tagName==='INPUT';
  if(k==='Escape'||k==='GoBack'||(k==='Backspace'&&!inInput)){e.preventDefault();return goBack()}
  if($('#player.on')){
    if(cur==='live'&&curList.length>1&&(k==='ArrowUp'||k==='ArrowDown')){
      e.preventDefault();curIdx=(curIdx+(k==='ArrowDown'?1:-1)+curList.length)%curList.length;
      const it=curList[curIdx];play(it.name,urlFor(it))}
    else flash();return}
  if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k))return;
  if(inInput&&(k==='ArrowLeft'||k==='ArrowRight'))return;
  e.preventDefault();move(k)});

function tick(){$('#clock').textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}
tick();setInterval(tick,30000);
if(cfg){$('#exp').textContent='';doLogin(cfg)}else show('login');
</script>
</body>
</html>
